<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BAB — Digital Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <main class="center-wrap" role="main">
      <header class="brand">
        <h1 class="logo">BAB🌿</h1>
        <p class="tagline">Digital Companion • พร้อมรับฟังเสมอ</p>
      </header>

      <form class="search-form" onsubmit="return false;" aria-label="ส่งข้อความถึง BAB">
        <label for="q" class="visually-hidden">ข้อความ</label>
        <div class="search-inner">
          <span class="icon" aria-hidden>💬</span>
          <input id="q" name="q" type="search" placeholder="พิมพ์สิ่งที่คุณต้องการพูดกับ BAB..." autocomplete="off">
         <button type="submit" class="search-submit">
          <span class="search-icon">🔍 ค้าหา</span>
         </button>
        </div>
      </form>

      <div class="quick-actions" role="list">
        <button class="pill" type="button">เครียดเรื่องเรียน</button>
        <button class="pill" type="button">นอนไม่หลับ</button>
        <button class="pill" type="button">อยากระบาย</button>
        <button class="pill" type="button">ผ่อนคลาย</button>
      </div>

      <p class="help-note">BAB เป็นพื้นที่ปลอดภัยสำหรับการระบายและรับฟัง — ไม่มีการตัดสิน</p>
    </main>

    <script>
      // Quick action fills the search input
      const input = document.getElementById('q');
      document.querySelectorAll('.quick-actions .pill').forEach(btn => {
        btn.addEventListener('click', () => {
          input.value = btn.textContent.trim();
          input.focus();
        });
      });
    </script>
  </body>
</html>
